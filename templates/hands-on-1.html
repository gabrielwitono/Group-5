<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hands-On 1</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --text: #e2e8f0;
      --muted: #94a3b8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: var(--text);
      background-color: var(--bg);
      background-image:
        radial-gradient(rgba(125, 211, 252, 0.28) 1.5px, transparent 1.6px),
        radial-gradient(circle at 20% 20%, #1e3a8a 0%, var(--bg) 60%);
      background-size: 26px 26px, 100% 100%;
      background-position: 0 0, center;
      background-attachment: fixed;
    }

    .card {
      width: 100%;
      max-width: 640px;
      padding: 48px 40px;
      border-radius: 20px;
      background: var(--card);
      border: 1px solid rgba(148, 163, 184, 0.25);
      box-shadow: 0 25px 60px rgba(2, 6, 23, 0.55);
      text-align: center;
    }

    .badge {
      display: inline-block;
      margin-bottom: 20px;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.35);
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(1.5rem, 4vw, 2.1rem);
      line-height: 1.35;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 1rem;
    }

    .student-id {
      display: inline-block;
      margin-top: 22px;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 0.95rem;
      letter-spacing: 0.04em;
      color: var(--text);
      background: rgba(56, 189, 248, 0.1);
      border: 1px dashed rgba(56, 189, 248, 0.45);
    }

    .student-id strong {
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }

    .status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 28px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.18);
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">Hands-On 1</span>
    <h1>Hello, this is a web app deployed at a local server!</h1>
    <p>Flask backend &middot; port 8000 &middot; reachable from your local network</p>
    <p class="student-id">Student ID &middot; <strong>124040087</strong></p>
    <div class="status">
      <span class="dot" aria-hidden="true"></span>
      <span>Server is running</span>
    </div>
  </main>
</body>
</html>
